<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Really Simple JS Calculator</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css" />
    <!-- Math.js library (for expression evaluation) -->
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.11.0/lib/browser/math.js"></script>
    <!-- Link to external JS file -->
    <script defer src="script.js"></script>
  </head>

  <body>
    <!-- Add a tab bar -->
    <div class="tab-bar">
      <button class="tab" data-target="standard">Standard</button>
      <button class="tab active" data-target="rpn">RPN</button>
    </div>

    <!-- Because the page now contains two calculators, 
    and you need a clean way to show one and hide the other 
    without breaking the layout.
    .calc-panel is simply the container for each calculator section
    (standard and rpn).
    -->

    <!-- standard calculator -->
    <div id="standard" class="calc-panel">
      <div class="calc">
        <div id="screen" class="screen">0</div>
        <div class="keys">
          <div class="spacer"></div>
          <div class="spacer"></div>
          <button id="clear">C</button>
          <button class="op">/</button>

          <button class="num">7</button>
          <button class="num">8</button>
          <button class="num">9</button>
          <button class="op">*</button>

          <button class="num">4</button>
          <button class="num">5</button>
          <button class="num">6</button>
          <button class="op">-</button>

          <button class="num">1</button>
          <button class="num">2</button>
          <button class="num">3</button>
          <button class="op">+</button>

          <button class="num">0</button>
          <button class="num">.</button>
          <div class="spacer"></div>
          <button id="equals">=</button>
        </div>
      </div>
    </div>

    <!-- rpn calculator -->
    <div id="rpn" class="calc-panel active">
      <div class="calc rpn-calc">
        <div id="rpn-screen" class="rpn-screen">0</div>
        <div class="keys rpn-keys">
          <!-- Row 1 -->
          <!-- CHS button is now a Clear -->
          <button id="rpn-clear" class="rpn-action">C</button>
          <button class="rpn-num">7</button>
          <button class="rpn-num">8</button>
          <button class="rpn-num">9</button>
          <button class="rpn-op">/</button>

          <!-- Row 2 -->
          <div class="spacer"></div>
          <!-- EEX placeholder -->
          <button class="rpn-num">4</button>
          <button class="rpn-num">5</button>
          <button class="rpn-num">6</button>
          <button class="rpn-op">*</button>

          <!-- Row 3 -->
          <button class="rpn-action enter" id="rpn-enter">Enter</button>
          <button class="rpn-num">1</button>
          <button class="rpn-num">2</button>
          <button class="rpn-num">3</button>
          <button class="rpn-op">-</button>

          <!-- Row 4 -->
          <!-- Enter continues here automatically because it spans 2 rows -->
          <button class="rpn-num wide-zero">0</button>
          <button class="rpn-num">.</button>
          <!-- Σ placeholder -->
          <div class="spacer"></div>
          <button class="rpn-op">+</button>
        </div>
      </div>
    </div>
  </body>
</html>
